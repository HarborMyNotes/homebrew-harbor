#
# Guards the formula on every push and pull request. Formula/harbor.rb is
# rewritten by harbor-cli's release workflow rather than by a person, so this is
# where a bad automatic bump gets caught before a user hits it.
#

name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-formula:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@b35a29a0f83ee8b8ca07b219fc8db3d7bb88ab49 # 2026.08.10.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      # Homebrew 6 refuses to load a third-party tap's Ruby until it is trusted,
      # so nothing below can read the formula without this.
      - name: Trust this tap
        run: brew trust "${{ steps.set-up-homebrew.outputs.tap-name }}"

      - name: Lint the tap
        run: brew test-bot --only-tap-syntax

      # A real install is the only thing that catches a wrong checksum or a url
      # pointing at an asset that was never published. Syntax linting does not
      # download anything.
      - name: Install and test the formula
        run: |
          brew install --formula "${{ steps.set-up-homebrew.outputs.tap-name }}/harbor"
          brew test harbor
          harbor --version
