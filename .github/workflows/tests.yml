#
# Guards the formula and the cask on every push and pull request. Formula/harbor.rb
# is rewritten by harbor-cli's release workflow rather than by a person, so this is
# where a bad bump of either one gets caught before a user hits it.
#

name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-formula:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      # Homebrew 6 refuses to load a third-party tap's Ruby until it is trusted,
      # so nothing below can read the formula without this.
      - name: Trust this tap
        run: brew trust "${{ steps.set-up-homebrew.outputs.tap-name }}"

      - name: Lint the tap
        run: brew test-bot --only-tap-syntax

      # A real install is the only thing that catches a wrong checksum or a url
      # pointing at an asset that was never published. Syntax linting does not
      # download anything.
      - name: Install and test the formula
        run: |
          brew install --formula "${{ steps.set-up-homebrew.outputs.tap-name }}/harbor"
          brew test harbor
          harbor --version

  # The Mac app only installs on macOS, so the cask gets its own macOS-only job.
  test-cask:
    name: harbor-notes cask
    runs-on: macos-26
    permissions:
      contents: read
    env:
      CASK: harbormynotes/harbor/harbor-notes
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: macos-26-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: macos-26-rubygems-

      - name: Trust this tap
        run: brew trust "${{ steps.set-up-homebrew.outputs.tap-name }}"

      - name: Style
        run: brew style --cask "$CASK"

      # --online fetches the DMG and checks it against the cask's sha256. The two
      # livecheck checks are skipped: they fail whenever a new app release is out
      # and the cask is not bumped yet, which would turn unrelated commits red.
      - name: Audit
        run: brew audit --cask --strict --online --except=livecheck_version,livecheck_https_availability "$CASK"

      # Fails only if livecheck cannot read the appcast. Prints the newest version.
      - name: Livecheck
        run: brew livecheck --cask "$CASK"

      # Proves the app is still signed and notarized, and that uninstall removes
      # it. spctl's answer depends on the runner's Gatekeeper setting, so this
      # checks the stapled notarization ticket directly.
      - name: Install and uninstall the cask
        run: |
          brew install --cask "$CASK"
          codesign --verify --deep --strict /Applications/Harbor.app
          xcrun stapler validate /Applications/Harbor.app
          brew uninstall --zap --cask "$CASK"
          test ! -e /Applications/Harbor.app
